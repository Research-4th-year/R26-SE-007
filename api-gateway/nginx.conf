
server {
    listen 10000;
    server_name _;

    # Health check for the gateway itself
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "Digital Goviya API Gateway OK\n";
    }

    # C01: Price Forecasting (FastAPI)
    location /api/forecast/ {
        proxy_pass http://c01-price-forecasting:10000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C02: Digital Farming
    location /api/farming/ {
        proxy_pass http://r26-se-007:10000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C03: Marketplace Python backend
    # Keep this more specific route before the general marketplace route.
    location /api/marketplace/ai/ {
        proxy_pass http://c03-marketplace-py:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C03: Marketplace Node.js backend
    location /api/marketplace/ {
        proxy_pass http://c03-marketplace-node:10000/;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # C04: Blockchain & Warehouse on your VPS
    location /api/blockchain/ {
        proxy_pass https://digital-goviya.duckdns.org/;

        proxy_ssl_server_name on;
        proxy_ssl_name digital-goviya.duckdns.org;

        proxy_set_header Host digital-goviya.duckdns.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
